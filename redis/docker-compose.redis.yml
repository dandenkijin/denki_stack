services:
  ## redis is used in odoo so why not
  ## do we need two redis instances? maybe it's that infisical, grype, and syft should have their own droplet?
  redis:
    image: redis
    container_name: infisical-redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_REPLICATION_MODE=master
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    deploy:
      endpoint_mode: vip
      labels:
        - traefik.tcp.routers.redis.rule=HostSNI(`*`)
        #- traefik.tcp.routers.redis.tls=true
        #- traefik.docker.network=host
        - traefik.docker.lbswarm=true
        - traefik.tcp.services.redis.loadbalancer.server.port=6379
        - traefik.tcp.routers.redis.entrypoints=redis
        - traefik.enable=true
        - traefik.tcp.routers.redis.service=redis

      replicas: 1
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure

  redis-commander:
    container_name: infisical-dev-redis-commander
    image: rediscommander/redis-commander
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8085:8081"

volumes:
  redis_data:
    driver: local
